[package]
name = "create_rust_app_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Scaffolding engine for Create Rust App (catalog, fetch, merge, install)"
license = "MIT"
repository = "https://github.com/Create-Rust-App/create-rust-app"
homepage = "https://github.com/Create-Rust-App/create-rust-app"
documentation = "https://github.com/Create-Rust-App/create-rust-app"
keywords = ["scaffolding", "templates", "cli", "generator"]
categories = ["development-tools"]

[lib]
name = "create_rust_app_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ureq = { version = "2", default-features = true }

[dev-dependencies]
tempfile = "3"
